server {
    listen 80;
    server_name localhost;

    # Serve the static frontend files
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # For React Router (SPA) - redirect 404s to index.html
        try_files $uri $uri/ /index.html;
    }

    # Proxy all /api requests to the backend container
    location /api/ {
        proxy_pass http://backend:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Enable WebSocket support if needed
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Optional: configure proxy for /docs if you want Swagger UI accessible
    # location /docs {
    #     proxy_pass http://backend:8001/docs;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
    
    # location /openapi.json {
    #     proxy_pass http://backend:8001/openapi.json;
    #     proxy_set_header Host $host;
    # }
}
